name: Bench

on:
  workflow_call:
    inputs:
      package:
        description: 'Package directory to measure'
        required: true
        type: string

# GITHUB_TOKEN only, and no more of it than the comment needs: this job runs
# the pull request's code, so it never holds the app token, which may push to
# master. Concurrency is the caller's: here it would be one group for every
# package.
permissions:
  contents: read
  pull-requests: write

jobs:
  Bench:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.package }}

    steps:
      # The merge commit, whose first parent is the base branch it measures
      # against.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Check out the base
        working-directory: .
        run: git worktree add "$RUNNER_TEMP/master" HEAD^1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      # Each side runs on its own install, so a change of the lockfile is
      # measured. A package the base does not have yet is measured alone. The
      # base installs without scripts: its only one sets up the git hooks.
      - name: Install the base's dependencies
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          if [ -f "$RUNNER_TEMP/master/$PACKAGE/package.json" ]; then
            cd "$RUNNER_TEMP/master/$PACKAGE" && npm ci --ignore-scripts
          fi

      # Its verdict is kept for the last steps, so the report is posted
      # whatever it says.
      - name: Bench
        id: bench
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          status=0
          npm run bench -- --compare "$RUNNER_TEMP/master/$PACKAGE" --report "$RUNNER_TEMP/bench.md" || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ -f "$RUNNER_TEMP/bench.md" ]; then
            cat "$RUNNER_TEMP/bench.md" >> "$GITHUB_STEP_SUMMARY"
            echo 'report=true' >> "$GITHUB_OUTPUT"
          fi

      # A fork's or Dependabot's run gets a read-only token: its report is the
      # job summary only.
      - name: Comment
        if: ${{ !cancelled() && steps.bench.outputs.report == 'true' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ inputs.package }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          ID="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"<!-- bench:$PACKAGE -->\"))) | .id" | head -n 1)"
          if [ -n "$ID" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$ID" -F "body=@$RUNNER_TEMP/bench.md" > /dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F "body=@$RUNNER_TEMP/bench.md" > /dev/null
          fi

      - name: Verdict
        if: steps.bench.outputs.status != '0' && steps.bench.outputs.status != '2'
        run: |
          echo 'A project of this branch failed: see the report.'
          exit 1

      # The labels are read now, not from the event, which a re-run keeps:
      # `bench-label.yml` re-runs this when the package's label changes, by
      # this step's name.
      - name: Comparison
        if: steps.bench.outputs.status == '2'
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL: bench-accepted:${{ inputs.package }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/issues/$PR/labels" --jq '.[].name' | grep -qxF "$LABEL"; then
            echo "The comparison failed, and the \`$LABEL\` label accepts it: see the report."
            exit 0
          fi
          echo "The comparison failed (a row is missing, or a project of the base failed): see the report. A comparison the change means to fail passes with the \`$LABEL\` label."
          exit 1
