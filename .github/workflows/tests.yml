name: Tests

on:
  workflow_call:
    inputs:
      package:
        description: 'Package directory to test'
        required: true
        type: string

jobs:
  Tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: [22, 24]
        os: [ubuntu-latest, windows-latest, macOS-latest]
    defaults:
      run:
        working-directory: ${{ inputs.package }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test

  # The parsers declare no runtime API of their own, so these legs exist to keep
  # that true. Dependencies still install through npm: the alternative runtimes
  # run the suite, they do not manage the tree.
  Runtimes:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # `bun x` resolves the binary but runs it on Node; `--bun` is what
          # puts the suite on Bun's own runtime.
          - runtime: bun
            test: bun --bun x vitest run
          # Deno reaches an npm binary by path, not through `node_modules/.bin`.
          - runtime: deno
            test: deno run -A node_modules/vitest/vitest.mjs run
    defaults:
      run:
        working-directory: ${{ inputs.package }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # `latest`, not the floor `engines` declares: Vitest needs a newer Bun
      # than the package itself does.
      - name: Setup Bun
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Deno
        if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: ${{ matrix.test }}
