name: Default parser publish

on:
  workflow_dispatch:
    inputs:
        version:
          description: 'Version'
          required: true
          default: 'patch'
          type: choice
          options:
            - patch
            - minor
            - major
            - prerelease
        preid:
          description: 'Prerelease identifier (used by the prerelease bump)'
          required: false
          default: 'next'
          type: string
        tag:
          description: 'npm dist-tag to publish under'
          required: false
          default: 'latest'
          type: string

jobs:
  tests:
    uses: ./.github/workflows/tests-parser-default.yml

  publish-npm:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - name: Install dependencies
        working-directory: parser-default
        run: npm install
      - name: Update version
        working-directory: parser-default
        run: npm version ${{ inputs.version }} --preid=${{ inputs.preid }}
      - uses: nyaa8/package-version@v1
        with:
          path: 'parser-default/package.json'
      - name: Commit files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -a -m 'chore(parser-default): release @sveltekit-i18n/parser-default@${{ env.PACKAGE_VERSION }}'
          git tag "parser-default@${{ env.PACKAGE_VERSION }}"
      - name: Push changes
        run: git push --follow-tags
      - name: Publish package
        working-directory: parser-default
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPM_TOKEN}}
        run: npm publish --tag ${{ inputs.tag }}
