name: Fluent parser bench

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - parser-fluent/src/**
      - parser-fluent/bench/**
      - parser-fluent/package.json
      - parser-fluent/package-lock.json
      - parser-fluent/tsconfig.json
      - parser-fluent/tsup.config.js
      - bench/**
      - .github/workflows/bench-parser-fluent.yml
      - .github/workflows/bench.yml

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: bench-${{ github.event.pull_request.number }}-parser-fluent
  cancel-in-progress: true

jobs:
  bench:
    uses: ./.github/workflows/bench.yml
    with:
      package: parser-fluent
